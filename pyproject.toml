[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pmihm"
dynamic = ["version"]
description = "Support for integrative models (IHMCIF) in PyMOL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Arthur Zalevsky", email = "aozalevsky@gmail.com"}]
requires-python = ">=3.9"
dependencies = ["ihm>=2.11"]  # 2.11+ reads spheres of non-polymers; PyMOL is not on PyPI
keywords = ["pymol", "ihm", "ihmcif", "pdb-ihm", "integrative", "coarse-grained", "mmcif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
bcif = ["msgpack"]
test = ["pytest", "msgpack"]

[project.urls]
Homepage = "https://github.com/aozalevsky/pmihm"
Issues = "https://github.com/aozalevsky/pmihm/issues"

[tool.setuptools]
packages = ["pmihm"]

[tool.setuptools.dynamic]
version = {attr = "pmihm.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
