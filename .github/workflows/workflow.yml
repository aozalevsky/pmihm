name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      # PyMOL is not on PyPI; conda-forge (setup-micromamba's default
      # channel) has it
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: test
          create-args: >-
            python=3.12
            pymol-open-source
            ihm>=2.11
            msgpack-python
            pytest
          init-shell: bash
          cache-environment: true
      - run: pip install --no-deps .
      - run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    # PyPI trusted publishing (repository aozalevsky/pmihm, this workflow,
    # environment pypi); runs when a GitHub release is published
    if: github.event_name == 'release'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pmihm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
